aid: featherless
url: https://raw.githubusercontent.com/api-evangelist/featherless/refs/heads/main/apis.yml
name: Featherless AI
kind: company
description: Featherless AI is a serverless LLM inference platform that serves thousands
  of open-weight models from the Hugging Face catalog behind a single OpenAI-compatible
  REST API. It uses flat monthly subscription pricing with unlimited tokens rather
  than per-token billing, exposing chat completions, text completions, an embeddings
  endpoint, and a large models catalog.
accessModel:
  pricing: paid
  onboarding: self-serve
