    type: Documentation
  - url: https://featherless.ai/docs/api-examples-and-snippets
    type: APIReference
  - url: openapi/featherless-openapi.yml
    type: OpenAPI
  - url: asyncapi/featherless-asyncapi.yml
    type: AsyncAPI
  - url: collections/featherless.postman_collection.json
    type: Postman
  description: OpenAI-compatible chat completions across thousands of open-weight
    Hugging Face models, with streaming, tool calling, vision messages, and the full
    set of sampling parameters (temperature, top_p, top_k, min_p, penalties).
- aid: featherless:featherless-completions-api
  name: Featherless Completions API
  tags:
  - Completions
  - Text Generation
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://featherless.ai/docs/completions
  baseURL: https://api.featherless.ai/v1
  properties:
