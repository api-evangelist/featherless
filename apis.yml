    type: Documentation
  - url: openapi/featherless-openapi.yml
    type: OpenAPI
  - url: collections/featherless.postman_collection.json
    type: Postman
  description: OpenAI-compatible embeddings endpoint that returns vector representations
    for a string or array of inputs using open embedding models such as Qwen3-Embedding,
    with optional encoding_format and dimensions.
