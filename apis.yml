  humanURL: https://featherless.ai/docs/quickstart-guide
  baseURL: https://api.featherless.ai/v1
  properties:
  - url: https://featherless.ai/docs/quickstart-guide
    type: Documentation
  - url: openapi/featherless-openapi.yml
    type: OpenAPI
  - url: collections/featherless.postman_collection.json
    type: Postman
  description: Lists the thousands of open-weight models available for serverless
    inference, surfaced through an OpenAI-compatible models endpoint for runtime discovery.
- aid: featherless:featherless-embeddings-api
  name: Featherless Embeddings API
  tags:
  - Embeddings
  - Vectors
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://featherless.ai/docs/embeddings
  baseURL: https://api.featherless.ai/v1
